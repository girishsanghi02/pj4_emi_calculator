<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EMI Calculator</title>

    <link rel="stylesheet" href="pj4.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>💰 EMI Calculator</h1>
            <p>Calculate your monthly loan EMI easily</p>
        </div>

        <div class="calculator">

            <!-- INPUT SECTION -->

            <div class="input-section">

                <h2>Loan Details</h2>

                <div class="input-group">
                    <label>Loan Amount</label>

                    <div class="input-box">
                        <span>₹</span>
                        <input type="number" id="loanAmount" value="500000">
                    </div>

                    <input type="range"
                           id="loanRange"
                           min="10000"
                           max="10000000"
                           step="10000"
                           value="500000">
                </div>


                <div class="input-group">
                    <label>Interest Rate (%)</label>

                    <div class="input-box">
                        <span>%</span>
                        <input type="number"
                               id="interestRate"
                               value="8.5"
                               step="0.1">
                    </div>

                    <input type="range"
                           id="interestRange"
                           min="1"
                           max="30"
                           step="0.1"
                           value="8.5">
                </div>


                <div class="input-group">
                    <label>Loan Tenure (Years)</label>

                    <div class="input-box">
                        <span>⌛</span>
                        <input type="number"
                               id="tenure"
                               value="5">
                    </div>

                    <input type="range"
                           id="tenureRange"
                           min="1"
                           max="30"
                           value="5">
                </div>


                <button onclick="calculateEMI()">
                    Calculate EMI
                </button>

            </div>


            <!-- RESULT SECTION -->

            <div class="result-section">

                <div class="emi-card">
                    <p>Monthly EMI</p>
                    <h2 id="monthlyEMI">₹0</h2>
                </div>


                <div class="result-grid">

                    <div class="result-box">
                        <h3>Principal Amount</h3>
                        <p id="principal">₹0</p>
                    </div>

                    <div class="result-box">
                        <h3>Total Interest</h3>
                        <p id="interest">₹0</p>
                    </div>

                    <div class="result-box">
                        <h3>Total Payment</h3>
                        <p id="totalPayment">₹0</p>
                    </div>

                    <div class="result-box">
                        <h3>Loan Tenure</h3>
                        <p id="displayTenure">0 Years</p>
                    </div>

                </div>


                <div class="summary">

                    <h3>📊 Loan Summary</h3>

                    <div class="summary-row">
                        <span>Loan Amount</span>
                        <strong id="summaryLoan">₹0</strong>
                    </div>

                    <div class="summary-row">
                        <span>Interest Rate</span>
                        <strong id="summaryRate">0%</strong>
                    </div>

                    <div class="summary-row">
                        <span>Tenure</span>
                        <strong id="summaryTenure">0 Years</strong>
                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="pj.js"></script>

</body>
</html>
